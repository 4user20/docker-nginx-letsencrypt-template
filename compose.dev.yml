services:
  api:
    build:
      context: ./example-app
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: portfolio-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal
    volumes:
      - ./example-app/apps/api/src:/app/apps/api/src:ro
      - ./example-app/apps/api/prisma:/app/apps/api/prisma:ro
    profiles:
      - dev

  web:
    build:
      context: ./example-app
      dockerfile: apps/web/Dockerfile
    container_name: portfolio-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    networks:
      - internal
    profiles:
      - dev

  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-portfolio_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-production}
      - POSTGRES_DB=${POSTGRES_DB:-portfolio_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio_user} -d ${POSTGRES_DB:-portfolio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  nginx:
    image: nginx:1.25-alpine
    container_name: portfolio-nginx
    restart: unless-stopped
    profiles:
      - dev

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
