# ── HTTP-only server block (dev mode, no SSL) ─────
server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Let's Encrypt challenge (works in dev too)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Metrics endpoint
    location /metrics {
        access_log off;
        proxy_pass http://api:3000/metrics;
        include /etc/nginx/snippets/proxy.conf;
    }

    # API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn addr 10;
        proxy_pass http://api:3000;
        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Auth endpoints
    location ~ ^/(auth|login|register)/ {
        limit_req zone=auth burst=5 nodelay;
        limit_conn addr 5;
        proxy_pass http://api:3000;
        include /etc/nginx/snippets/proxy.conf;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 86400;
    }

    # Static files (web service — not API)
    location ^~ /assets/ {
        proxy_pass http://web:80;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://web:80;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        expires 30d;
    }

    # Default location — SPA
    location / {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://web:80;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ── HTTP to HTTPS redirect (production) ───────────
server {
    listen 80;
    server_name yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server (production) ─────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # Metrics endpoint
    location /metrics {
        access_log off;
        proxy_pass http://api:3000/metrics;
        include /etc/nginx/snippets/proxy.conf;
    }

    # API endpoints
    location /api/ {
